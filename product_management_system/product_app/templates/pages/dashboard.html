{% extends 'master/base.html' %}

{% block content %}

<h1>Dashboard</h1>

<br>

<form method="GET" class="mb-4">

    <div class="col-md-4">

        <input
            type="text"
            name="search"
            class="form-control"
            placeholder="Search product by name..."
            value="{{ request.GET.search }}">

        <button type="submit" class="btn btn-primary my-2" >Search</button>

        <a href="{% url 'dashboard' %}"class="btn btn-secondary my-2">Clear</a>

    </div>

</form>


<div class="row g-4">

    {% for product in products %}

        <div class="col-md-4">

            <div class="card h-100 shadow-sm">

                {% if product.image %}

                    <img src="{{ product.image.url }}" class="card-img-top" style="height: 200px; object-fit: cover;">

                {% endif %}

                <div class="card-body">

                    <h5 class="card-title">
                        {{ product.name }}
                    </h5>

                    <p class="card-text">
                        {{ product.description }}
                    </p>

                    <p class="fw-bold">
                        Price: {{ product.price }}
                    </p>

                    <a
                        href="{% url 'product_detail' product.id %}" class="btn btn-info">View Details</a>

                </div>

            </div>

        </div>

    {% empty %}

        <div class="col-12">
            <p>No products found.</p>
        </div>

    {% endfor %}

</div>

{% endblock %}
